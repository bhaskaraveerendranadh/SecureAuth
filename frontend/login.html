<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="SecureAuth - Secure Login Portal">
    <title>Login - SecureAuth</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="logo-icon">🔒</div>
            <h1>SecureAuth</h1>
            <p class="subtitle">Sign in to your secure account</p>

            <div id="login-alert" class="alert"></div>

            <form id="login-form" autocomplete="off">
                <div class="form-group">
                    <label for="email">📧 Email Address</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email" required>
                </div>
                <div class="form-group">
                    <label for="password">🔑 Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required>
                </div>
                <button type="submit" class="btn btn-primary" id="login-btn">
                    🔐 Sign In Securely
                </button>
            </form>

            <p style="text-align:center; margin-top:1.5rem; color:var(--text-secondary); font-size:.85rem;">
                Don't have an account? <a href="signup.html">Create Account</a>
            </p>

            <div style="margin-top:1.5rem; padding-top:1rem; border-top:1px solid var(--border-color);">
                <div class="security-item" style="background:transparent; padding:.25rem 0;">
                    <span class="security-check">✓</span>
                    <span style="font-size:.75rem; color:var(--text-muted);">Protected against SQL Injection, XSS & CSRF</span>
                </div>
                <div class="security-item" style="background:transparent; padding:.25rem 0;">
                    <span class="security-check">✓</span>
                    <span style="font-size:.75rem; color:var(--text-muted);">Brute force protection enabled</span>
                </div>
            </div>
        </div>
    </div>

    <script src="js/common.js"></script>
    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            hideAlert('login-alert');
            const btn = document.getElementById('login-btn');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> Authenticating...';

            try {
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                const result = await apiRequest('/auth/login', 'POST', { email, password });

                if (result && result.success) {
                    showAlert('login-alert', 'Login successful! Redirecting...', 'success');
                    setTimeout(() => {
                        if (result.user && result.user.role === 'admin') {
                            window.location.href = '/admin.html';
                        } else {
                            window.location.href = '/dashboard.html';
                        }
                    }, 800);
                } else {
                    showAlert('login-alert', result?.message || 'Login failed.', 'error');
                }
            } catch (err) {
                showAlert('login-alert', 'Connection error. Please try again.', 'error');
            }

            btn.disabled = false;
            btn.innerHTML = '🔐 Sign In Securely';
        });
    </script>
</body>
</html>
